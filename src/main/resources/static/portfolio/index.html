<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <title>Stock Trading Portfolio</title>
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="portfolio.css" rel="stylesheet">
  </head>
  <body>

    <div class="container">
      <div id="heading" class="masthead">
        <div class="float-end">
          <span class="text-info" data-bind="text: username"><em></em></span>&nbsp;
          <button data-bind="click: logout" class="btn btn-outline-secondary">Sign out</button>
        </div>
        <h3 class="text-secondary">Stock Trading Portfolio</h3>
      </div>
      <div id="main-content" class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Company</th>
              <th>Ticker</th>
              <th class="number">Price</th>
              <th class="number">Change</th>
              <th>%</th>
              <th class="number">Shares</th>
              <th class="number">Value</th>
              <th></th>
            </tr>
          </thead>
          <tbody data-bind="foreach: portfolio().rows">
            <tr>
              <td data-bind="text: company"></td>
              <td data-bind="text: ticker"></td>
              <td data-bind="text: formattedPrice" class="number"></td>
              <td data-bind="text: change, style: {color: change() < 0 ? 'red' : 'green'}" class="number"></td>
              <td data-bind="text: arrow" class="icon"></td>
              <td data-bind="text: shares" class="number"></td>
              <td data-bind="text: formattedValue" class="number"></td>
              <td class="trade-buttons">
                <button class="btn btn-primary" data-bind="click: $root.trade().showBuy">Buy</button>
                <button class="btn btn-primary" data-bind="click: $root.trade().showSell">Sell</button>
              </td>
             </tr>
          </tbody>
          <tfoot>
            <tr>
              <td colspan="5">Total</td>
              <td data-bind="text: portfolio().totalShares" class="number"></td>
              <td data-bind="text: portfolio().totalValue" class="number"></td>
              <td></td>
            </tr>
          </tfoot>
          <tbody></tbody>
        </table>
        <div class="alert alert-warning">
          <h5>Notifications</h5>
          <ul data-bind="foreach: notifications">
            <li data-bind="text: notification"></li>
          </ul>
        </div>
      </div>
      <div id="trade-dialog" class="modal fade" tabindex="-1" aria-label="Trade shares" aria-hidden="true">
        <div class="modal-dialog"><div class="modal-content">
        <div class="modal-body">
          <form class="form-horizontal" data-bind="submit: trade().executeTrade">
            <fieldset>
              <legend>
                <span data-bind="text: trade().action"></span>
                <span data-bind="text: trade().currentRow().company"></span> Stock
              </legend>
            </fieldset>
            <div class="mb-3">
              <label class="form-label" for="inputShares">Shares</label>
              <div class="controls">
                <input id="inputShares" class="form-control" type="number" data-bind="value: trade().sharesToTrade">
                <span class="text-danger" role="alert" data-bind="text: trade().error"></span>
              </div>
            </div>
            <div class="mb-3">
              <div class="controls">
                <label class="form-check-label"><input class="form-check-input" type="checkbox" data-bind="checked: trade().suppressValidation">
                  Suppress client-side validation</label>
              </div>
            </div>
            <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Close</button>
            <button class="btn btn-primary" type="submit">
              <span data-bind="text: trade().action"></span>
            </button>
          </form>
        </div>
        </div></div>
      </div>
    </div>

    <!-- 3rd party -->
    <script src="../vendor/jquery.min.js"></script>
    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../vendor/knockout.js"></script>
    <script src="../vendor/sockjs.min.js"></script>
    <script src="../vendor/stomp.umd.min.js"></script>
    <script src="../messaging.js"></script>

    <!-- application -->
    <script src="portfolio.js"></script>
    <script>
      (function() {
        var stompClient = DemoMessaging.createClient();

        var appModel = new ApplicationModel(stompClient);
        ko.applyBindings(appModel);

        appModel.connect();
        appModel.pushNotification("Trade results take a 2-3 second simulated delay. Notifications will appear.");
      })();
    </script>

  </body>
</html>
