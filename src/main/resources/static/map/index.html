<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Car Map</title>
  <link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
  <style>
    html, body, #map_canvas { height: 100%; margin: 0; }
    #status { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 8px; font: 14px sans-serif; }
  </style>
</head>
<body>
  <div id="map_canvas" aria-label="Live car locations"></div>
  <div id="status" role="status">Connecting…</div>
  <script src="../vendor/leaflet/leaflet.js"></script>
  <script src="../vendor/sockjs.min.js"></script>
  <script src="../vendor/stomp.umd.min.js"></script>
  <script src="../messaging.js"></script>
  <script>
    const map = L.map('map_canvas').setView([46.947922, 7.444608], 14);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    const cars = {};
    const client = DemoMessaging.createClient();
    const status = document.getElementById('status');
    client.onConnect = () => {
      status.textContent = 'Live';
      for (const color of ['blue', 'red']) {
        client.subscribe('/topic/map/' + color + 'Car', message => {
          const { lat, lng } = JSON.parse(message.body);
          if (cars[color]) {
            cars[color].setLatLng([lat, lng]);
          } else {
            cars[color] = L.marker([lat, lng], {
              icon: L.icon({ iconUrl: 'car_sedan_' + color + '.png', iconSize: [32, 32] }),
              title: color + ' car'
            }).addTo(map);
          }
        });
      }
    };
    client.onWebSocketClose = () => { status.textContent = 'Reconnecting…'; };
    client.activate();
  </script>
</body>
</html>
