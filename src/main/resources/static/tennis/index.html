<!DOCTYPE html>
<html>
<head>
<title>Tennis</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../vendor/bootstrap.min.css">
<link rel="stylesheet" href="css/flags.css">

<style type="text/css">
.sets {
	background-color: #e5E5E5;
}

.serve {
	color: yellow;
	background-color: #ccc
}
</style>

</head>
<body>
	<div class="container">
		<h2>Tennis Game Tournament - Spring Framework 7, Websocket, SockJS, Stomp</h2>
		<p> 
			<a href="https://github.com/mgreau/javaee7-websocket" target="blog">See the source project on GitHub.</a>
		</p>
		<div class="row">
			<div class="card border-primary">
				<div class="card-header">
					<span id="m1-title"></span> - <span id="m1-status"
						class="badge text-bg-success"></span>

				</div>
				<div class="card-body">
					<table class="table">
						<thead>
							<tr>
								<th width="5%">S1</th>
								<th width="5%">S2</th>
								<th width="5%">S3</th>
								<th width="5%" class="table-active"></th>
								<th width="5%" class="table-active"></th>
								<th width="45%" class="table-active">PLAYERS</th>
								<th width="10%" class="table-active">POINTS</th>
								<th width="10%" class="table-active">GAMES</th>
								<th width="10%" class="table-active">SETS</th>
							</tr>
						</thead>
						<tbody>
							<tr>
								<td class="sets"><span id="m1-p1-set1"
									class="badge text-bg-warning">0</span></td>
								<td class="sets"><span id="m1-p1-set2"
									class="badge text-bg-warning">0</span></td>
								<td class="sets"><span id="m1-p1-set3"
									class="badge text-bg-warning">0</span></td>
								<td><span id="m1-p1-serve" class="badge serve"></span></td>
								<td><img src="img/blank.gif" class="flag flag-rs" /></td>
								<td id="m1-p1"></td>
								<td class="table-active"><span id="m1-p1-points"
									class="badge text-bg-danger">-</span></td>
								<td id="m1-p1-games">0</td>
								<td id="m1-p1-sets"></td>
							</tr>
							<tr>
								<td class="sets"><span id="m1-p2-set1"
									class="badge text-bg-warning">0</span></td>
								<td class="sets"><span id="m1-p2-set2"
									class="badge text-bg-warning">0</span></td>
								<td class="sets"><span id="m1-p2-set3"
									class="badge text-bg-warning">0</span></td>
								<td><span id="m1-p2-serve" class="badge serve"></span></td>
								<td><img src="img/blank.gif" class="flag flag-es" /></td>
								<td id="m1-p2"></td>
								<td class="table-active"><span id="m1-p2-points"
									class="badge text-bg-danger">-</span></td>
								<td id="m1-p2-games">0</td>
								<td id="m1-p2-sets"></td>
							</tr>
						</tbody>
					</table>
					<div class="row">
						<div class="col-sm-6 col-md-3">
							<div class="card p-2 h-100">
								<div class="d-flex gap-2">
									<a class="float-start" href="#"> <img class="img-fluid"
										alt="player1" src="img/ferrer.jpg">
									</a>
									<div class="flex-grow-1">
										<h4 id="m1-p1-card" class="h5"></h4>
										<p>
											<a href="#" class="btn btn-primary btn-sm"
												onclick="betMatchWinner('Ferrer D.')">Match Winner ?</a>
										</p>
									</div>
								</div>
							</div>
						</div>
						<div class="col-sm-6 col-md-3">
							<div class="card p-2 h-100">
								<div class="d-flex gap-2">
									<a class="float-start" href="#"> <img class="img-fluid"
										alt="player2" src="img/almagro.jpg">
									</a>
									<div class="flex-grow-1">
										<h4 id="m1-p2-card" class="h5"></h4>
										<p>
											<a href="#" class="btn btn-primary btn-sm"
												onclick="betMatchWinner('Almagro N.')">Match Winner ?</a>
										</p>
									</div>
								</div>
							</div>
						</div>
						<div class="col-sm-6 col-md-3">
							<div class="card p-2 h-100">
								<ul>
									<li>Bet Match Winner : <span id="m1-betmatchwinner"
										class="badge text-bg-warning"></span></li>
									<li>Result : <span id="m1-betmatchwinner-result"
										class="badge text-bg-secondary"></span></li>
								</ul>
							</div>
						</div>
						<div class="col-sm-6 col-md-3">
							<div class="card p-2 h-100">
								<div class="d-flex gap-2">
									<textarea style="font-size: 11px; background-color: #e5e5e5;"
										id="m1-comments" class="form-control" rows="4" readonly></textarea>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
    <script src="../vendor/sockjs.min.js"></script>
    <script src="../vendor/stomp.umd.min.js"></script>
    <script src="../messaging.js"></script>
	<script src="js/websocket.js"></script>
</body>
</html>
